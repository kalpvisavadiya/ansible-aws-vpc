
- hosts: localhost
  connection: local
  gather_facts: False

  tasks:

    - name: Import Vpc Variable
      include_vars: vars/vpc_setup

    - name: Create vprofile VPC
      amazon.aws.ec2_vpc_net:
        name: "{{ vpc_name }}"
        cidr_block: "{{ vpcCidr }}"
        region: "{{ region }}"
        dns_support: yes
        dns_hostnames: yes
        tenancy: default
        state: "{{ state }}"
      register: vpcout

    # PUBLIC SUBNETS

    - name: Create Public Subnet 1
      amazon.aws.ec2_vpc_subnet:
        vpc_id: "{{ vpcout.vpc.id }}"
        cidr: "{{ PubSub1Cidr }}"
        az: "{{ zone1 }}"
        region: "{{ region }}"
        map_public: yes
        state: "{{ state }}"
        resource_tags:
          Name: vprofile-public-subnet-1
      register: pubsub1

    - name: Create Public Subnet 2
      amazon.aws.ec2_vpc_subnet:
        vpc_id: "{{ vpcout.vpc.id }}"
        cidr: "{{ PubSub2Cidr }}"
        az: "{{ zone2 }}"
        region: "{{ region }}"
        map_public: yes
        state: "{{ state }}"
        resource_tags:
          Name: vprofile-public-subnet-2
      register: pubsub2

    - name: Create Public Subnet 3
      amazon.aws.ec2_vpc_subnet:
        vpc_id: "{{ vpcout.vpc.id }}"
        cidr: "{{ PubSub3Cidr }}"
        az: "{{ zone1 }}"
        region: "{{ region }}"
        map_public: yes
        state: "{{ state }}"
        resource_tags:
          Name: vprofile-public-subnet-3
      register: pubsub3

    # PRIVATE SUBNETS

    - name: Create Private Subnet 1
      amazon.aws.ec2_vpc_subnet:
        vpc_id: "{{ vpcout.vpc.id }}"
        cidr: "{{ PrivSub1Cidr }}"
        az: "{{ zone1 }}"
        region: "{{ region }}"
        map_public: no
        state: "{{ state }}"
        resource_tags:
          Name: vprofile-private-subnet-1
      register: privsub1

    - name: Create Private Subnet 2
      amazon.aws.ec2_vpc_subnet:
        vpc_id: "{{ vpcout.vpc.id }}"
        cidr: "{{ PrivSub2Cidr }}"
        az: "{{ zone2 }}"
        region: "{{ region }}"
        map_public: no
        state: "{{ state }}"
        resource_tags:
          Name: vprofile-private-subnet-2
      register: privsub2

    - name: Create Private Subnet 3
      amazon.aws.ec2_vpc_subnet:
        vpc_id: "{{ vpcout.vpc.id }}"
        cidr: "{{ PrivSub3Cidr }}"
        az: "{{ zone3 }}"
        region: "{{ region }}"
        map_public: no
        state: "{{ state }}"
        resource_tags:
          Name: vprofile-private-subnet-3
      register: privsub3

    # DISPLAY OUTPUT

    - name: Display VPC Output
      debug:
        var: vpcout

    - name: Display All Subnets
      debug:
        msg:
          - "Public Subnet 1: {{ pubsub1.subnet.id }}"
          - "Public Subnet 2: {{ pubsub2.subnet.id }}"
          - "Public Subnet 3: {{ pubsub3.subnet.id }}"
          - "Private Subnet 1: {{ privsub1.subnet.id }}"
          - "Private Subnet 2: {{ privsub2.subnet.id }}"
          - "Private Subnet 3: {{ privsub3.subnet.id }}"

    - name: Create Internet Gateway
      amazon.aws.ec2_vpc_igw:
        vpc_id: "{{ vpcout.vpc.id }}"
        region: "{{ region }}"
        state: "{{ state }}"
        tags:
          Name: vprofile-igw
      register: igwout

    - name: Create Public Route Table
      amazon.aws.ec2_vpc_route_table:
        vpc_id: "{{ vpcout.vpc.id }}"
        region: "{{ region }}"
        state: "{{ state }}"
        tags:
          Name: vprofile-public-rt

        subnets:
          - "{{ pubsub1.subnet.id }}"
          - "{{ pubsub2.subnet.id }}"
          - "{{ pubsub3.subnet.id }}"

        routes:
          - dest: 0.0.0.0/0
            gateway_id: "{{ igwout.gateway_id }}"

      register: publicrt

    - name: Get Existing Elastic IP
      amazon.aws.ec2_eip_info:
        region: "{{ region }}"
        filters:
          "tag:Name": vprofile-nat-eip
      register: existing_eip

    - name: Allocate Elastic IP if not exists
      amazon.aws.ec2_eip:
        region: "{{ region }}"
        in_vpc: true
        state: present
        tags:
          Name: vprofile-nat-eip
      register: new_eip
      when: existing_eip.addresses | length == 0

    - name: Set Elastic IP Fact
      set_fact:
        eip_allocation_id: >-
          {{ existing_eip.addresses[0].allocation_id
             if existing_eip.addresses | length > 0
             else new_eip.allocation_id }}
          
    

    - name: Create NAT Gateway
      amazon.aws.ec2_vpc_nat_gateway:
        subnet_id: "{{ pubsub1.subnet.id }}"
        allocation_id: "{{ eip_allocation_id }}"
        region: "{{ region }}"
        state: present
        wait: true
        tags:
          Name: vprofile-nat-gateway
      register: natout

    - name: Create Private Route Table
      amazon.aws.ec2_vpc_route_table:
        vpc_id: "{{ vpcout.vpc.id }}"
        region: "{{ region }}"
        state: "{{ state }}"
        tags:
          Name: vprofile-private-rt

        subnets:
          - "{{ privsub1.subnet.id }}"
          - "{{ privsub2.subnet.id }}"
          - "{{ privsub3.subnet.id }}"

        routes:
          - dest: 0.0.0.0/0
            nat_gateway_id: "{{ natout.nat_gateway_id }}"

      register: privatert



    # SET FACTS

    - name: Set Facts for All AWS Resources
      ansible.builtin.set_fact:
        vpc_id: "{{ vpcout.vpc.id }}"
        pubsub1_id: "{{ pubsub1.subnet.id }}"
        pubsub2_id: "{{ pubsub2.subnet.id }}"
        pubsub3_id: "{{ pubsub3.subnet.id }}"
        privsub1_id: "{{ privsub1.subnet.id }}"
        privsub2_id: "{{ privsub2.subnet.id }}"
        privsub3_id: "{{ privsub3.subnet.id }}"
        igw_id: "{{ igwout.gateway_id }}"
        eip_id: "{{ eipout.allocation_id }}"
        nat_id: "{{ natout.nat_gateway_id }}"
        publicrt_id: "{{ publicrt.route_table.id }}"
        privatert_id: "{{ privatert.route_table.id }}"
        cacheable: yes

    # COPY RESOURCE IDs

    - name: Copy All Resource IDs to Output File
      ansible.builtin.copy:
        content: |
          VPC ID: {{ vpc_id }}

          Public Subnet 1 ID: {{ pubsub1_id }}
          Public Subnet 2 ID: {{ pubsub2_id }}
          Public Subnet 3 ID: {{ pubsub3_id }}

          Private Subnet 1 ID: {{ privsub1_id }}
          Private Subnet 2 ID: {{ privsub2_id }}
          Private Subnet 3 ID: {{ privsub3_id }}

          Internet Gateway ID: {{ igw_id }}
          Elastic IP Allocation ID: {{ eip_id }}
          NAT Gateway ID: {{ nat_id }}

          Public Route Table ID: {{ publicrt_id }}
          Private Route Table ID: {{ privatert_id }}
        dest: vars/output_var

    # DEBUG USING LOOP

    - name: Display All Resource IDs
      ansible.builtin.debug:
        msg: "{{ item.name }} : {{ item.id }}"
      loop:
        - { name: "VPC ID", id: "{{ vpc_id }}" }
        - { name: "Public Subnet 1", id: "{{ pubsub1_id }}" }
        - { name: "Public Subnet 2", id: "{{ pubsub2_id }}" }
        - { name: "Public Subnet 3", id: "{{ pubsub3_id }}" }
        - { name: "Private Subnet 1", id: "{{ privsub1_id }}" }
        - { name: "Private Subnet 2", id: "{{ privsub2_id }}" }
        - { name: "Private Subnet 3", id: "{{ privsub3_id }}" }
        - { name: "Internet Gateway", id: "{{ igw_id }}" }
        - { name: "Elastic IP", id: "{{ eip_id }}" }
        - { name: "NAT Gateway", id: "{{ nat_id }}" }
        - { name: "Public Route Table", id: "{{ publicrt_id }}" }
        - { name: "Private Route Table", id: "{{ privatert_id }}" }
      loop_control:
        label: "{{ item.name }}"
